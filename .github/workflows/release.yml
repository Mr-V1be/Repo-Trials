name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and attach distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          expected = f"v{data['project']['version']}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match package version {expected!r}")
          PY

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Generate checksums
        shell: bash
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Create release when the tag was pushed directly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "RepoTrials $GITHUB_REF_NAME" \
              --generate-notes

      - name: Attach wheel, source distribution, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Keep the distributions for the optional PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Opt-in PyPI publication. Dormant until BOTH of these are done once, by hand:
  #
  #   1. https://pypi.org/manage/account/publishing/ -> add a pending publisher
  #        PyPI project name: repotrials
  #        Owner:             PozziTiv4ik
  #        Repository:        Repo-Trials
  #        Workflow:          release.yml
  #        Environment:       pypi
  #   2. Settings -> Secrets and variables -> Actions -> Variables ->
  #        PUBLISH_TO_PYPI = true
  #
  # Until then this job is skipped and the release above behaves exactly as it
  # does today. Trusted publishing uses short-lived OIDC credentials, so there
  # is no API token to store or rotate.
  publish-pypi:
    name: Publish to PyPI
    needs: build-and-publish
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/repotrials
    permissions:
      id-token: write        # mint the OIDC token trusted publishing exchanges
      attestations: write    # record build provenance for the published files
      contents: read

    steps:
      - name: Download the distributions built from the tag
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/

      - name: Drop the checksum file
        shell: bash
        run: rm -f dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
