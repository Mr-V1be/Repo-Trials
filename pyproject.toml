[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repotrials"
version = "0.1.0"
description = "Turn Git history into private, reproducible coding-agent evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PozziTiv4ik" }]
keywords = [
  "ai-agents",
  "benchmark",
  "coding-agents",
  "developer-tools",
  "evaluation",
  "swe-bench",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
repotrials = "repotrials.cli:main"

[project.urls]
Homepage = "https://github.com/PozziTiv4ik/Repo-Trials"
Repository = "https://github.com/PozziTiv4ik/Repo-Trials.git"
Issues = "https://github.com/PozziTiv4ik/Repo-Trials/issues"
Changelog = "https://github.com/PozziTiv4ik/Repo-Trials/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["repotrials"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["repotrials"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
