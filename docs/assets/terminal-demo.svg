  <g clip-path="url(#td-screen)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace">
    <g opacity="1">  <!-- frame 1: 0s → 2s -->
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.076471;0.084034;1" dur="23.8s" repeatCount="indefinite"/>
      <text xml:space="preserve" x="54" y="100" font-size="15"><tspan fill="#58e1c1" font-weight="700">$</tspan><tspan fill="#e9eefb"> repotrials init</tspan></text>
      <text xml:space="preserve" x="54" y="126" font-size="15"><tspan fill="#58e1c1" font-weight="700">OK</tspan><tspan fill="#93a3c3">  initialized ~/demo-repository/repotrials.toml</tspan></text>
      <text xml:space="preserve" x="54" y="152" font-size="15"><tspan fill="#8d83ff" font-weight="700">INFO</tspan><tspan fill="#93a3c3">  Review repotrials.toml, then run `repotrials doctor`.</tspan></text>
      <text xml:space="preserve" x="54" y="178" font-size="15"><tspan fill="#58e1c1" font-weight="700">$</tspan></text>
