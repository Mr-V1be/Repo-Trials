<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="446" viewBox="0 0 1040 446" role="img" aria-labelledby="td-title td-desc">
  <title id="td-title">RepoTrials quickstart, replayed in a terminal</title>
  <desc id="td-desc">Animated terminal cast of the RepoTrials quickstart: init, doctor, mine, candidates, validate, two agent runs, compare and report. The final frame shows noop-agent 0 of 1 against fix-agent 1 of 1, a delta of plus 100.0 percentage points, and a written HTML report.</desc>
  <defs>
    <linearGradient id="td-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#101a35"/>
      <stop offset="1" stop-color="#17143a"/>
    </linearGradient>
    <pattern id="td-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#91a4ca" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="td-screen">
      <rect x="28" y="70" width="984" height="322"/>
    </clipPath>
  </defs>

  <rect width="1040" height="446" rx="18" fill="url(#td-background)"/>
  <rect width="1040" height="446" rx="18" fill="url(#td-grid)"/>
  <circle cx="980" cy="20" r="150" fill="#6858ff" opacity="0.10"/>
  <circle cx="70" cy="440" r="170" fill="#31c9aa" opacity="0.07"/>

  <!-- terminal chrome -->
  <rect x="28" y="28" width="984" height="364" rx="14" fill="#0b1428" stroke="#334466"/>
  <path d="M28 70H1012" stroke="#334466"/>
