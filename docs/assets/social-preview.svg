<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">RepoTrials — SWE-bench for your own repository</title>
  <desc id="sp-desc">Social preview card: RepoTrials mines your git log into sealed coding-agent tasks and grades them on your machine. Bundled demo shows noop-agent 0 of 1 versus fix-agent 1 of 1, a plus 100 percentage point delta.</desc>
  <defs>
    <linearGradient id="sp-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#101a35"/>
      <stop offset="1" stop-color="#17143a"/>
    </linearGradient>
    <linearGradient id="sp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e1c1"/>
      <stop offset="1" stop-color="#8d83ff"/>
    </linearGradient>
    <pattern id="sp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#91a4ca" stroke-opacity="0.08"/>
    </pattern>
    <filter id="sp-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-background)"/>
  <rect width="1280" height="640" fill="url(#sp-grid)"/>
  <circle cx="1150" cy="40" r="200" fill="#6858ff" opacity="0.11"/>
  <circle cx="110" cy="620" r="240" fill="#31c9aa" opacity="0.08"/>

  <!-- wordmark row: safe area starts at x=80 / y=80 -->
  <g transform="translate(80 80) scale(1.625)">
    <path d="M0 8a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v48a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="url(#sp-accent)"/>
    <path d="M17 19h30M17 31h20M17 43h26" stroke="#07101f" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="282" y="168" fill="#f5f7ff" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="100" font-weight="750" letter-spacing="-3">RepoTrials</text>

  <g>
    <rect x="960" y="110" width="240" height="46" rx="23" fill="#141f38" stroke="#334466"/>
    <text x="1080" y="141" text-anchor="middle" fill="#8d83ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="18">pre-release · v0.1</text>
  </g>

  <rect x="82" y="212" width="300" height="4" rx="2" fill="url(#sp-accent)" filter="url(#sp-glow)" opacity="0.9"/>

  <text x="82" y="268" fill="#dbe3f5" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="50" font-weight="600" letter-spacing="-0.8">SWE-bench for your own repository</text>
  <text x="82" y="322" fill="#8fa0c2" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="40">Mined from your git log. Graded on your machine.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace">
    <rect x="80" y="366" width="1120" height="142" rx="18" fill="#141f38" stroke="#334466"/>
    <text x="112" y="412" fill="#7f8dab" font-size="24">$ repotrials demo — under 5 s, no API key, no Docker, nothing uploaded</text>
    <text x="112" y="472" fill="#91a1c1" font-size="34">noop-agent</text>
    <text x="332" y="472" fill="#ff8a9b" font-size="34" font-weight="700">0/1</text>
    <text x="425" y="472" fill="#8d83ff" font-size="34">→</text>
    <text x="470" y="472" fill="#91a1c1" font-size="34">fix-agent</text>
    <text x="670" y="472" fill="#58e1c1" font-size="34" font-weight="700">1/1</text>
    <path d="M778 446V484" stroke="#334466" stroke-width="2"/>
    <text x="812" y="472" fill="#91a1c1" font-size="34">delta</text>
    <text x="934" y="472" fill="#58e1c1" font-size="34" font-weight="700">+100 pp</text>
  </g>

  <text x="82" y="548" fill="#7f8dab" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="24">Apache-2.0  ·  Python 3.11+  ·  zero runtime dependencies  ·  nothing is uploaded</text>
</svg>
