<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RepoTrials — your repository is the benchmark</title>
  <desc id="desc">Git history is transformed into sealed coding-agent trials and evidence-based reports.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#101a35"/>
      <stop offset="1" stop-color="#17143a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e1c1"/>
      <stop offset="1" stop-color="#8d83ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#91a4ca" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1040" cy="55" r="170" fill="#6858ff" opacity="0.10"/>
  <circle cx="165" cy="405" r="210" fill="#31c9aa" opacity="0.08"/>

  <g transform="translate(72 62)">
    <path d="M0 8a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v48a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="url(#accent)"/>
    <path d="M17 19h30M17 31h20M17 43h26" stroke="#07101f" stroke-width="5" stroke-linecap="round"/>
    <text x="88" y="48" fill="#f5f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="750" letter-spacing="-1.5">RepoTrials</text>
    <text x="4" y="105" fill="#b8c4df" font-family="Inter,Segoe UI,sans-serif" font-size="25">Your repository is the benchmark.</text>
    <text x="4" y="142" fill="#7f8dab" font-family="Inter,Segoe UI,sans-serif" font-size="18">Private · leak-resistant · reproducible coding-agent evaluations</text>
  </g>

  <g transform="translate(72 274)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
    <g>
      <rect width="206" height="82" rx="13" fill="#141f38" stroke="#334466"/>
      <text x="20" y="32" fill="#58e1c1" font-weight="700">01  Git history</text>
      <text x="20" y="58" fill="#91a1c1">real fix commits</text>
    </g>
    <path d="M218 41h45" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="m256 34 9 7-9 7" fill="none" stroke="#72c8cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(278)">
      <rect width="206" height="82" rx="13" fill="#141f38" stroke="#334466"/>
      <text x="20" y="32" fill="#58e1c1" font-weight="700">02  Sealed tasks</text>
      <text x="20" y="58" fill="#91a1c1">hidden F2P / P2P</text>
    </g>
    <path d="M496 41h45" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="m534 34 9 7-9 7" fill="none" stroke="#72c8cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(556)">
      <rect width="206" height="82" rx="13" fill="#141f38" stroke="#334466"/>
      <text x="20" y="32" fill="#8d83ff" font-weight="700">03  Agent trials</text>
      <text x="20" y="58" fill="#91a1c1">same task + budget</text>
    </g>
    <path d="M774 41h45" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="m812 34 9 7-9 7" fill="none" stroke="#827fdf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(834)">
      <rect width="222" height="82" rx="13" fill="#141f38" stroke="#685eff" stroke-opacity="0.8"/>
      <text x="20" y="32" fill="#a69eff" font-weight="700">04  Evidence</text>
      <text x="20" y="58" fill="#91a1c1">quality · cost · time</text>
    </g>
  </g>
  <rect x="72" y="386" width="310" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)" opacity="0.85"/>
</svg>
